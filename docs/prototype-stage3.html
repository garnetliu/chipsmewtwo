<style>
  :root{
    --primary:#3b7dd8; --primary-hover:#2f6bc0; --primary-active:#265aa8;
    --primary-soft:#e4edfa; --primary-border:#c2d7f2;
    --canvas:#f4f6fb; --surface:#fff; --border:#e2e7f2;
    --ink-900:#17203a; --ink-700:#3b4767; --ink-500:#677191; --ink-400:#8a94b3;
    --success:#3d9b62; --success-soft:#e8f5ec;
    --warning:#d9901a; --warning-soft:#fdf3e0;
    --danger:#e03e3e; --danger-soft:#fdecec;
    --ver-red:#e03e3e; --ver-green:#3d9b62; --ver-blue:#3b7dd8; --ver-yellow:#f2c531;
    --ver-gold:#c9a227; --ver-silver:#8a94a8;
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:9999px;
    --shadow-sm:0 1px 2px rgba(23,32,58,.05); --shadow-md:0 2px 8px rgba(23,32,58,.08);
    --shadow-primary:0 2px 8px rgba(59,125,216,.28);
  }
  body{background:var(--canvas);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .ver-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.5rem;height:1.25rem;padding:0 .3rem;font-size:.625rem;font-weight:700;line-height:1;border-radius:var(--radius-sm);letter-spacing:.02em;color:#fff;}
  .type-tag{display:inline-flex;align-items:center;height:1.375rem;padding:0 .55rem;font-size:.6875rem;font-weight:600;border-radius:var(--radius-full);color:#fff;}
  .gen-chip{display:inline-flex;align-items:center;height:2rem;padding:0 .85rem;font-size:.8125rem;font-weight:600;border-radius:var(--radius-full);background:#fff;color:var(--ink-700);border:1px solid var(--border);cursor:pointer;user-select:none;}
  .gen-chip:hover{border-color:var(--primary-border);}
  .gen-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-primary);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.25rem;padding:0 1rem;border-radius:var(--radius-md);font-size:.8125rem;font-weight:600;border:1px solid transparent;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-primary);}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-secondary{background:#fff;color:var(--ink-700);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--primary-border);color:var(--primary);}
  .nav-link{position:relative;font-size:.875rem;font-weight:600;color:var(--ink-700);cursor:pointer;padding:.25rem 0;}
  .nav-link:hover{color:var(--primary);}
  .nav-link.active{color:var(--primary);}
  .nav-link.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-1.28rem;width:1.5rem;height:3px;border-radius:2px;background:var(--primary);}
  .poke-card{transition:box-shadow .15s ease, transform .15s ease;cursor:pointer;}
  .poke-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .row-click{cursor:pointer;}
  .row-click:hover{background:var(--primary-soft);}
  .field-input{width:100%;height:2.5rem;padding:0 .75rem;border-radius:var(--radius-md);border:1px solid var(--border);font-size:.8125rem;color:var(--ink-900);outline:none;background:#fff;}
  .field-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .field-input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);color:var(--danger);}
  .field-label{font-size:.75rem;font-weight:600;color:var(--ink-700);margin-bottom:.375rem;display:block;}
  .field-err{font-size:.6875rem;color:var(--danger);margin-top:.3rem;display:none;}
  .field-err.show{display:block;}
  .data-table{width:100%;text-align:left;font-size:.8125rem;}
  .data-table thead th{background:#f8fafd;font-size:.75rem;color:var(--ink-500);font-weight:600;padding:.65rem 1rem;}
  .data-table tbody td{padding:.75rem 1rem;border-top:1px solid #f0f3f9;}
  .link-primary{color:var(--primary);font-weight:600;font-size:.75rem;cursor:pointer;}
  .link-primary:hover{color:var(--primary-hover);}
  .badge-mini{font-size:.625rem;font-weight:600;border-radius:.25rem;padding:.15rem .45rem;}
  .stat-bar-track{flex:1;height:.5rem;border-radius:9999px;background:#eef1f7;overflow:hidden;}
  .stat-bar-fill{height:.5rem;border-radius:9999px;}
  [data-bp-view]{display:none;}
  [data-bp-view].active{display:block;}
</style>

<script>
/* ================= 路由与通用渲染 ================= */
const $ = s => document.querySelector(s);
const viewOf = id => document.querySelector(`[data-bp-view="${id}"]`);
let navStack = [];

function showView(id){
  document.querySelectorAll('[data-bp-view]').forEach(v => v.classList.toggle('active', v.dataset.bpView === id));
  const top = { 'pokemon-detail':'pokemon-list','move-detail':'move-list','item-detail':'item-list','ability-detail':'ability-list' }[id] || id;
  document.querySelectorAll('[data-bp-nav]').forEach(n => {
    const on = n.dataset.bpNav === top;
    n.classList.toggle('active', on);
    if (on) n.setAttribute('aria-current','page'); else n.removeAttribute('aria-current');
  });
  window.scrollTo({top:0});
}
function go(id, payload){
  if (id === 'pokemon-list') renderPokemonList();
  if (id === 'move-list') renderMoveList();
  if (id === 'item-list') renderItemList();
  if (id === 'ability-list') renderAbilityList();
  if (id === 'pokemon-detail') renderPokemonDetail(payload);
  if (id === 'move-detail') renderMoveDetail(payload);
  if (id === 'item-detail') renderItemDetail(payload);
  if (id === 'ability-detail') renderAbilityDetail(payload);
  if (id === 'ev-simulator') renderSimulator();
  showView(id);
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-bp-nav]');
  if (nav) { navStack = []; go(nav.dataset.bpNav); return; }
  const back = e.target.closest('[data-bp-back]');
  if (back) { const prev = navStack.pop() || back.dataset.bpBack; go(prev.view, prev.payload); }
});
function badgesHTML(list){
  return list.map(b => `<span class="ver-badge" style="background:${VERSION_BADGES[b]||'#8a94a8'};${b==='黄'?'color:var(--ink-900);':''}">${b}</span>`).join(' ');
}
function typesHTML(types){
  return types.map(t => `<span class="type-tag" style="background:${TYPE_COLORS[t]||'#8a94a8'};">${t}</span>`).join(' ');
}
function genChipsHTML(stateKey, current, gens){

<script>
/* ================= 努力值模拟器 ================= */
const sim = { pokemon:null, level:50, nature:0, ivs:[31,31,31,31,31,31], evs:[0,0,0,0,0,0] };
function renderSimulator(){
  viewOf('ev-simulator').innerHTML = `
    <div class="flex items-end justify-between mb-6 flex-wrap gap-4">
      <div>
        <div class="flex items-center gap-3"><h1 class="text-[26px] font-bold tracking-tight">努力值模拟器</h1>
        <span class="text-xs font-semibold rounded-full px-2.5 py-1" style="color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-border);">独立工具</span></div>
        <p class="mt-1.5 text-[13px] text-ink-500">选择 Pokémon 后输入等级、性格、个体值与努力值，系统实时计算六项能力值。</p>
      </div>
    </div>
    <div id="sim-body"></div>`;
  renderSimBody();
}
function renderSimBody(){
  const body = viewOf('ev-simulator').querySelector('#sim-body');
  if (!sim.pokemon){
    body.innerHTML = `
      <div class="grid grid-cols-2 gap-5">
        <div class="card p-5" data-bp-anchor="sim-picker">
          <div class="text-[15px] font-bold mb-3">选择 Pokémon</div>
          <div class="grid grid-cols-3 gap-2.5">
            ${POKEMON.map(p => `<button class="gen-chip w-full justify-center" data-sim-pick="${p.id}">${p.name}</button>`).join('')}
          </div>
        </div>
        <div class="card p-10 flex flex-col items-center justify-center text-center" style="background:var(--canvas);border-style:dashed;">
          <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:var(--warning-soft);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9901a" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l10 17H2z"/><path d="M12 10v4M12 17.5v.01"/></svg>
          </div>
          <div class="text-[14px] font-semibold mt-4">请选择 Pokémon 后开始计算</div>
          <div class="text-[12px] text-ink-400 mt-1.5">从左侧选择一只 Pokémon，即可输入参数并查看计算结果</div>
        </div>
      </div>`;
    body.querySelectorAll('[data-sim-pick]').forEach(b => b.onclick = () => { sim.pokemon = +b.dataset.simPick; renderSimBody(); });
    return;
  }
  const p = POKEMON.find(x => x.id === sim.pokemon);
  const nature = NATURES[sim.nature];
  const evTotal = sim.evs.reduce((a,b)=>a+b,0);
  const errors = {};
  if (!(sim.level>=1 && sim.level<=100)) errors.level = '等级需在 1–100 之间';
  sim.ivs.forEach((v,i) => { if (!(v>=0 && v<=31)) errors['iv'+i] = '个体值需在 0–31 之间'; });
  sim.evs.forEach((v,i) => { if (!(v>=0 && v<=252)) errors['ev'+i] = '单项努力值需在 0–252 之间'; });
  if (evTotal > 510) errors.evTotal = '努力值总和不能超过 510（当前 ' + evTotal + '）';
  const hasErr = Object.keys(errors).length > 0;
  const results = p.stats.map((base,i) => {
    const iv = Math.min(31, Math.max(0, sim.ivs[i]||0)), ev = Math.min(252, Math.max(0, sim.evs[i]||0));
    const lv = (sim.level>=1 && sim.level<=100) ? sim.level : 50;
    if (i === 0) return Math.floor((2*base+iv+Math.floor(ev/4))*lv/100) + lv + 10;
    let v = Math.floor((2*base+iv+Math.floor(ev/4))*lv/100) + 5;
    if (nature.up === i) v = Math.floor(v*1.1);
    if (nature.down === i) v = Math.floor(v*0.9);
    return v;
  });
  const statRow = (i) => `
    <div class="grid grid-cols-12 gap-3 items-center">
      <span class="col-span-2 text-[13px] font-semibold text-ink-700">${STAT_NAMES[i]} <span class="text-[10px] text-ink-400 font-normal tabular-nums">${p.stats[i]}</span></span>
      <div class="col-span-3"><input class="field-input ${errors['iv'+i]?'invalid':''}" data-iv="${i}" type="number" min="0" max="31" value="${sim.ivs[i]}"><div class="field-err ${errors['iv'+i]?'show':''}">${errors['iv'+i]||''}</div></div>
      <div class="col-span-3"><input class="field-input ${errors['ev'+i]?'invalid':''}" data-ev="${i}" type="number" min="0" max="252" step="4" value="${sim.evs[i]}"><div class="field-err ${errors['ev'+i]?'show':''}">${errors['ev'+i]||''}</div></div>
      <div class="col-span-4 flex items-center gap-3">
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100,Math.round(results[i]/300*100))}%;background:${i===0?'var(--success)':'var(--primary)'};"></div></div>
        <span class="text-[17px] font-bold tabular-nums w-12 text-right" style="color:var(--primary);">${results[i]}</span>
      </div>
    </div>`;
  body.innerHTML = `
    <div class="grid grid-cols-3 gap-5">
      <div class="card p-5" data-bp-anchor="sim-config">
        <div class="flex items-center justify-between mb-3"><span class="text-[15px] font-bold">参数设置</span>
          <button class="link-primary" id="sim-repick">更换 Pokémon</button></div>
        <div class="flex items-center gap-3 rounded-lg border border-slate-200 p-3 mb-4" style="background:var(--primary-soft);">
          <div class="w-11 h-11 rounded-lg flex items-center justify-center bg-white"><span class="text-[12px] font-black" style="color:${TYPE_COLORS[p.types[0]]};">${p.name.slice(-2)}</span></div>
          <div><div class="text-[14px] font-bold">${p.name}</div><div class="text-[10.5px] text-ink-400">No.${p.no} · ${p.types.join(' / ')}</div></div>
        </div>
        <label class="field-label">等级（1–100）</label>
        <input class="field-input ${errors.level?'invalid':''}" id="sim-level" data-bp-state="sim-level" type="number" min="1" max="100" value="${sim.level}">
        <div class="field-err ${errors.level?'show':''}">${errors.level||''}</div>
        <label class="field-label mt-4">性格</label>
        <select class="field-input" id="sim-nature" data-bp-state="sim-nature">
          ${NATURES.map((n,i) => `<option value="${i}" ${i===sim.nature?'selected':''}>${n.name}${n.up?`（${STAT_NAMES[n.up]}↑ ${STAT_NAMES[n.down]}↓）`:'（无修正）'}</option>`).join('')}
        </select>
        <div class="flex items-center justify-between mt-4 text-[12px]">
          <span class="text-ink-500 font-semibold">努力值总和</span>
          <span class="font-bold tabular-nums ${evTotal>510?'':'text-ink-700'}" style="${evTotal>510?'color:var(--danger);':''}">${evTotal} / 510</span>
        </div>
        <div class="field-err ${errors.evTotal?'show':''}">${errors.evTotal||''}</div>
        <button class="btn btn-secondary w-full mt-4" id="sim-reset">重置全部输入</button>
      </div>
      <div class="card p-5 col-span-2" data-bp-anchor="sim-result">
        <div class="flex items-center justify-between mb-4">
          <span class="text-[15px] font-bold">计算结果</span>
          <div class="grid grid-cols-2 gap-x-4 text-[11px] text-ink-400"><span>中间两列：个体值 / 努力值</span><span class="text-right">右侧：实时能力值</span></div>
        </div>
        ${hasErr ? `<div class="rounded-lg px-4 py-3 mb-4 flex items-center gap-2.5 text-[13px] font-medium" style="background:var(--danger-soft);color:var(--danger);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
          输入有误，修正标红字段后将自动重新计算</div>` : ''}
        <div class="space-y-3.5">${[0,1,2,3,4,5].map(statRow).join('')}</div>
      </div>
    </div>`;
  const b2 = viewOf('ev-simulator');
  b2.querySelector('#sim-repick').onclick = () => { sim.pokemon = null; renderSimBody(); };
  b2.querySelector('#sim-level').onchange = e => { sim.level = parseInt(e.target.value)||0; renderSimBody(); };
  b2.querySelector('#sim-nature').onchange = e => { sim.nature = +e.target.value; renderSimBody(); };
  b2.querySelectorAll('[data-iv]').forEach(inp => inp.onchange = e => { sim.ivs[+e.target.dataset.iv] = parseInt(e.target.value)||0; renderSimBody(); });
  b2.querySelectorAll('[data-ev]').forEach(inp => inp.onchange = e => { sim.evs[+e.target.dataset.ev] = parseInt(e.target.value)||0; renderSimBody(); });
  b2.querySelector('#sim-reset').onclick = () => { sim.level=50; sim.nature=0; sim.ivs=[31,31,31,31,31,31]; sim.evs=[0,0,0,0,0,0]; renderSimBody(); };
}
</script>
<script>
/* ================= 顶部搜索模态框 ================= */
const modal = $('#search-modal'), sInput = $('#search-input'), sBody = $('#search-body');
let searchTimer = null;
const SEARCH_INDEX = [
  ...POKEMON.map(p => ({kind:'精灵', name:p.name, sub:`No.${p.no} · ${p.types.join('/')}`, view:'pokemon-detail', id:p.id, color:'var(--primary)', bg:'var(--primary-soft)'})),
  ...MOVES.map(m => ({kind:'招式', name:m.name, sub:m.desc, view:'move-detail', id:m.id, color:'#c2571d', bg:'#fdf0e4'})),
  ...ITEMS.map(i => ({kind:'道具', name:i.name, sub:i.desc, view:'item-detail', id:i.id, color:'#7a4fc9', bg:'#f1eafc'})),
  ...ABILITIES.map(a => ({kind:'特性', name:a.name, sub:a.short, view:'ability-detail', id:a.id, color:'#1f8a8a', bg:'#e3f4f4'}))
];
function openSearch(){
  modal.classList.remove('hidden');
  renderSearchState('empty');
  setTimeout(() => sInput.focus(), 30);
}
function closeSearch(){ modal.classList.add('hidden'); sInput.value=''; }
function renderSearchState(state, results){
  if (state === 'empty'){
    sBody.innerHTML = `<div class="px-5 py-10 text-center">
      <div class="text-[13px] font-semibold text-ink-700">输入名称开始搜索</div>
      <div class="text-[12px] text-ink-400 mt-1.5">支持 Pokémon / 招式 / 道具 / 特性，例如「妙蛙」「飞叶快刀」「讲究头带」「茂盛」</div></div>`;
  } else if (state === 'loading'){
    sBody.innerHTML = `<div class="px-5 py-10"><div class="flex items-center gap-3 justify-center text-[13px] text-ink-500">
      <span class="inline-block w-4 h-4 rounded-full border-2 border-slate-200 animate-spin" style="border-top-color:var(--primary);"></span>搜索中…</div></div>`;
  } else if (state === 'none'){
    sBody.innerHTML = `<div class="px-5 py-10 text-center">
      <div class="text-[13px] font-semibold text-ink-700">未找到匹配结果</div>
      <div class="text-[12px] text-ink-400 mt-1.5">换个关键词试试，支持四类资料对象的名称搜索</div></div>`;
  } else if (state === 'error'){
    sBody.innerHTML = `<div class="px-5 py-10 text-center">
      <div class="text-[13px] font-semibold" style="color:var(--danger);">搜索暂时不可用，请稍后再试</div>
      <div class="text-[12px] text-ink-400 mt-1.5">已保留你的输入，可直接重试</div>
      <button class="btn btn-secondary mt-4" id="search-retry" style="height:2rem;font-size:.75rem;">重试</button></div>`;
    $('#search-retry').onclick = () => doSearch(sInput.value.trim());
  } else {
    sBody.innerHTML = `<div class="py-2">${results.map(r => `
      <div class="row-click flex items-center gap-3 px-5 py-3 cursor-pointer" data-hit="${r.view}:${r.id}">
        <span class="badge-mini shrink-0" style="background:${r.bg};color:${r.color};">${r.kind}</span>
        <span class="text-[13.5px] font-bold shrink-0">${r.name}</span>
        <span class="text-[12px] text-ink-400 truncate">${r.sub||''}</span>
        <svg class="ml-auto shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a94b3" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>`).join('')}</div>`;
    sBody.querySelectorAll('[data-hit]').forEach(el => el.onclick = () => {
      const [view, id] = el.dataset.hit.split(':');
      closeSearch(); navStack = [{view:'pokemon-list'}]; go(view, +id);
    });
  }
}
function doSearch(kw){
  if (!kw){ renderSearchState('empty'); return; }
  renderSearchState('loading');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (kw.includes('错误') || kw.includes('故障')){ renderSearchState('error'); return; } // 演示失败态
    const hits = SEARCH_INDEX.filter(x => x.name.includes(kw));
    renderSearchState(hits.length ? 'results' : 'none', hits.slice(0, 10));
  }, 420);
}
sInput.addEventListener('input', () => doSearch(sInput.value.trim()));
document.addEventListener('click', e => { if (e.target.closest('[data-bp-open="search-modal"]')) openSearch(); });
$('#search-close').onclick = closeSearch;
$('#search-backdrop').onclick = closeSearch;
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); }
  if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeSearch();
});

/* ================= 初始化 ================= */
renderPokemonList();
</script>
